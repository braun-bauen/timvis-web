<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timvis domains</title>
    <script defer type="module" src="/src/options-page.ts"></script>
  </head>
  <body>
    <calcite-shell>
      <calcite-panel
        heading="Timvis domains"
        description="Add domains to track, set an hourly time limit, and keep useful paths available."
        scale="l"
        heading-level="1"
      >
        <calcite-action
          id="add-domain"
          slot="header-actions-end"
          text="Add domain"
          text-enabled
          icon="plus"
          class="action-brand"
        ></calcite-action>

        <calcite-block-group id="domains"></calcite-block-group>

        <calcite-dialog id="edit-dialog" heading="Add domain" modal>
          <calcite-input
            id="edit-domain-input"
            label="Domain name"
          ></calcite-input>
          <calcite-button
            id="edit-cancel"
            slot="footer-end"
            appearance="outline"
          >
            Cancel
          </calcite-button>
          <calcite-button id="edit-save" slot="footer-end">
            Save
          </calcite-button>
        </calcite-dialog>
      </calcite-panel>
    </calcite-shell>

    <template id="alert-template">
      <calcite-alert slot="alerts">
        <div slot="title">Changes saved</div>
      </calcite-alert>
    </template>

    <template id="domain-template">
      <calcite-block collapsible>
        <calcite-action
          data-action="delete-domain"
          slot="header-menu-actions"
          text="Delete"
          text-enabled
          icon="trash"
        ></calcite-action>
        <form>
          <div class="row">
            <calcite-select required name="unit" label-text="Time unit">
              <calcite-option value="minutes">Minutes</calcite-option>
              <calcite-option value="seconds">Seconds</calcite-option>
            </calcite-select>
            <calcite-input
              name="limit"
              required
              label-text="Time limit"
              type="number"
              min="1"
              max="25"
              step="1"
              value="5"
            ></calcite-input>
          </div>
          <calcite-text-area
            name="whitelist"
            label-text="Whitelisted paths (one per line)"
            rows="3"
            placeholder="/inbox&#10;/settings"
          ></calcite-text-area>
          <div class="row">
            <calcite-action
              type="submit"
              data-action="save-changes"
              text="Save changes"
              icon="save"
              text-enabled
              class="action-brand"
              disabled
            ></calcite-action>
          </div>
        </form>
      </calcite-block>
    </template>
  </body>
</html>
