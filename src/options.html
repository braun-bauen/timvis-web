<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timvis domains</title>
    <script defer type="module" src="/src/options-page.ts"></script>
  </head>
  <body>
    <calcite-shell>
      <calcite-panel
        heading="Timvis domains"
        description="Add domains to track, set an hourly time limit, and keep useful paths available."
        scale="l"
        heading-level="1"
      >
        <calcite-action
          id="add-domain"
          slot="header-actions-end"
          text="Add domain"
          text-enabled
          icon="plus"
          scale="l"
        ></calcite-action>
        <calcite-action
          id="save"
          slot="header-actions-end"
          text="Save changes"
          text-enabled
          icon="save"
          scale="l"
        ></calcite-action>

        <div id="status" role="status" aria-live="polite"></div>

        <calcite-block-group id="domains"></calcite-block-group>

        <calcite-dialog id="edit-dialog" heading="Edit domain" modal>
          <calcite-input id="edit-domain-input" label="Domain name"></calcite-input>
          <calcite-button id="edit-cancel" slot="footer-end" appearance="outline">
            Cancel
          </calcite-button>
          <calcite-button id="edit-save" slot="footer-end">Save</calcite-button>
        </calcite-dialog>
      </calcite-panel>
    </calcite-shell>

    <template id="domain-template">
      <calcite-block collapsible>
          <calcite-action
            data-action="edit-domain"
          slot="header-menu-actions"
          text="Edit"
          text-enabled
          icon="pencil"
        ></calcite-action>
          <calcite-action
            data-action="delete-domain"
          slot="header-menu-actions"
          text="Delete"
          text-enabled
          icon="x"
        ></calcite-action>
        <section>
          <div class="row">
            <calcite-select data-field="unit" label-text="Time unit">
              <calcite-option value="minutes">Minutes</calcite-option>
              <calcite-option value="seconds">Seconds</calcite-option>
            </calcite-select>
            <calcite-input
              data-field="limit"
              label-text="Time limit"
              type="number"
              min="1"
              step="1"
              value="5"
            ></calcite-input>
          </div>
          <calcite-text-area
            data-field="whitelist"
            label-text="Whitelisted paths (one per line)"
            rows="3"
            placeholder="/inbox&#10;/settings"
          ></calcite-text-area>
        </section>
      </calcite-block>
    </template>
  </body>
</html>
