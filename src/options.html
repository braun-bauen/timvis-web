<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timvis Options</title>
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">Timvis</p>
        <h1>Domain Limits</h1>
        <p class="lede">
          Add domains to track, set an hourly time limit, and keep useful paths
          available.
        </p>
      </header>

      <section class="card" aria-labelledby="domains-title">
        <div class="section-header">
          <div>
            <h2 id="domains-title">Blocked Domains</h2>
            <p>Permission is requested when a new domain is saved.</p>
          </div>
          <button id="add-domain" type="button">Add Domain</button>
        </div>
        <div id="domains" class="domains"></div>
      </section>

      <footer class="actions">
        <div id="status" role="status" aria-live="polite"></div>
        <button id="save" type="button">Save Changes</button>
      </footer>
    </main>
    <template id="domain-template">
      <article class="domain-card">
        <div class="domain-grid">
          <label>
            <span>Domain</span>
            <input class="domain-input" type="text" placeholder="example.com" />
          </label>
          <label>
            <span>Hourly limit</span>
            <input class="limit-input" type="number" min="1" step="1" />
          </label>
          <label>
            <span>Unit</span>
            <select class="unit-input">
              <option value="minutes">Minutes</option>
              <option value="seconds">Seconds</option>
            </select>
          </label>
        </div>
        <label>
          <span>Whitelisted paths</span>
          <textarea
            class="paths-input"
            rows="3"
            placeholder="/inbox&#10;/settings"
          ></textarea>
        </label>
        <div class="domain-actions">
          <button class="remove-domain" type="button">Remove</button>
        </div>
      </article>
    </template>
    <script type="module" src="/src/options.ts"></script>
  </body>
</html>
