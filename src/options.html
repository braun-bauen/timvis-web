<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timvis domains</title>
    <script defer type="module" src="/src/options-page.ts"></script>
  </head>
  <body>
    <calcite-shell>
      <calcite-panel
        heading="Timvis domains"
        description="Add domains to track, set an hourly time limit, and keep useful paths available."
        scale="l"
        heading-level="1"
      >
        <calcite-action
          id="add-domain"
          slot="header-actions-end"
          text="Add domain"
          text-enabled
          icon="plus"
          class="action-brand"
        ></calcite-action>

        <calcite-block-group id="domains"></calcite-block-group>

        <calcite-dialog id="edit-dialog" heading="Add domain" modal>
          <form id="add-domain-form">
            <calcite-input
              id="edit-domain-input"
              label="Domain name"
            ></calcite-input>
          </form>
          <calcite-button
            id="edit-cancel"
            form="add-domain-form"
            slot="footer-end"
            appearance="outline"
          >
            Cancel
          </calcite-button>
          <calcite-button
            id="edit-save"
            form="add-domain-form"
            type="submit"
            slot="footer-end"
          >
            Save
          </calcite-button>
        </calcite-dialog>
      </calcite-panel>
    </calcite-shell>

    <template id="alert-template">
      <calcite-alert slot="alerts">
        <div slot="title">Changes saved</div>
      </calcite-alert>
    </template>

    <template id="domain-template">
      <calcite-block collapsible>
        <calcite-action
          data-action="delete-domain"
          slot="header-menu-actions"
          text="Delete"
          text-enabled
          icon="trash"
        ></calcite-action>
        <form>
          <div class="row">
            <calcite-select required name="unit" label-text="Time unit">
              <calcite-option value="minutes">Minutes</calcite-option>
              <calcite-option value="seconds">Seconds</calcite-option>
            </calcite-select>
            <calcite-input
              name="limit"
              required
              label-text="Time limit"
              type="number"
              min="1"
              max="25"
              step="1"
              value="5"
            ></calcite-input>
          </div>
          <calcite-text-area
            name="whitelist"
            label-text="Whitelisted paths (one per line)"
            rows="3"
            placeholder="/inbox&#10;/settings"
          ></calcite-text-area>
          <div>
            <div class="downtime-header">Downtime</div>
            <div>
              Completely block this domain on recurring weekly schedules.
            </div>
          </div>
          <div class="downtime">
            <div class="downtime-rules"></div>
            <calcite-action
              data-action="add-downtime"
              text="Add downtime rule"
              text-enabled
              icon="plus"
            ></calcite-action>
          </div>
          <div class="row">
            <calcite-action
              type="submit"
              data-action="save-changes"
              text="Save changes"
              icon="save"
              text-enabled
              class="action-brand"
              disabled
            ></calcite-action>
          </div>
        </form>
      </calcite-block>
    </template>

    <template id="downtime-template">
      <div class="downtime-rule">
        <div class="downtime-flex">
          <calcite-chip-group scale="s" selection-mode="multiple" label="Days">
            <calcite-chip value="0" label="Sunday">S</calcite-chip>
            <calcite-chip value="1" label="Monday">M</calcite-chip>
            <calcite-chip value="2" label="Tuesday">T</calcite-chip>
            <calcite-chip value="3" label="Wednesday">W</calcite-chip>
            <calcite-chip value="4" label="Thursday">T</calcite-chip>
            <calcite-chip value="5" label="Friday">F</calcite-chip>
            <calcite-chip value="6" label="Saturday">S</calcite-chip>
          </calcite-chip-group>

          <div class="downtime-flex downtime-flex-sm">
            <calcite-input-time-picker
              data-time="start"
              label="Downtime start"
              scale="s"
              step="60"
            ></calcite-input-time-picker>
            <calcite-icon icon="arrow-right"></calcite-icon>
            <calcite-input-time-picker
              data-time="end"
              label="Downtime end"
              scale="s"
              step="60"
            ></calcite-input-time-picker>
          </div>

          <div class="downtime-flex">
            <calcite-switch
              data-switch="all-day"
              label-text-end="All day"
            ></calcite-switch>
            <calcite-switch
              data-switch="allow-whitelist"
              label-text-end="Allow whitelisted paths"
            ></calcite-switch>
          </div>
        </div>

        <calcite-action
          data-action="delete-downtime"
          text="Delete downtime"
          icon="trash"
        ></calcite-action>
      </div>
    </template>
  </body>
</html>
